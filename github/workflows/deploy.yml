name: Deploy to EC2

on:
  push:
    branches:
      - main  # Triggers deployment whenever you push code to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST_Ankit }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY_Ankit }}
        port: 22
        script: |
          # Navigate to your application directory
          cd /var/www/my-app
          
          # If git isn't initialized yet, clone the repo; otherwise, pull updates
          if [ ! -d ".git" ]; then
            git clone https://github.com{{ github.repository }}.git .
          else
            git pull origin main
          fi
          
          # Optional: Add steps here to restart your app (e.g., npm install, pm2 restart, docker compose up)
